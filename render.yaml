# Render Blueprint — deploy with: Render dashboard → New + → Blueprint → pick this repo → Apply.
services:
  - type: web
    name: grand-line-tcg
    runtime: node
    plan: free
    buildCommand: npm install && npm run sync-cards   # no deps to install; sync pulls any new cards/alt arts
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # MUST be >= 22.13 — that's the first Node where `node:sqlite` works without a CLI flag.
      # "22" resolves to the newest 22.x release.
      - key: NODE_VERSION
        value: "22"
      # Uncomment BOTH lines below (and add a Disk mounted at /data on a paid plan)
      # to keep accounts + saved decks across deploys:
      # - key: DATA_DIR
      #   value: /data
