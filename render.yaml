# Render Blueprint — lets you deploy this app on Render with one click:
# push the repo to GitHub, then in Render: New → Blueprint → pick the repo. Done.
services:
  - type: web
    name: grand-line-tcg
    runtime: node
    plan: free
    buildCommand: "echo no build step"
    startCommand: node server/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # Uncomment (and add a Disk mounted at /data on a paid plan) to persist accounts/decks across deploys:
      # - key: DATA_DIR
      #   value: /data
